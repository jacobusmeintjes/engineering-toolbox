receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlp/traces:
    endpoint: data-prepper:21890
    tls: { insecure: true }
  otlp/logs:
    endpoint: data-prepper:21892
    tls: { insecure: true }
  otlp/metrics:
    endpoint: data-prepper:21891
    tls: { insecure: true }

service:
  pipelines:
    traces:  { receivers: [otlp], processors: [batch], exporters: [otlp/traces] }
    logs:    { receivers: [otlp], processors: [batch], exporters: [otlp/logs] }
    metrics: { receivers: [otlp], processors: [batch], exporters: [otlp/metrics] }